sourceSets {
  integrationTest {
    java.srcDir file('src/integTest/java')
    resources.srcDir file('src/integTest/resources')
    compileClasspath += sourceSets.main.output + configurations.testRuntimeClasspath
    runtimeClasspath += output + compileClasspath
  }
}

task integrationTest(type: Test) {
  description = 'Runs the integration tests.'
  group = 'verification'
}

// Gradle 5.x and 6.x are not tested: they bundle Groovy 2.x, which cannot run on Java 16+, and they cannot load
// this plugin's Java 17 bytecode. Java 17 requires Gradle 7.3 or higher.
['**/ScanIT_Gradle_Versions_7_6*.class',
 '**/ScanIT_Gradle_Versions_8_3*.class',
 '**/ScanIT_Gradle_Versions_8_6*.class',
 '**/ScanIT_Gradle_Versions_8_11*.class'].eachWithIndex { className, index ->
  task "it${index + 1}"(type: Test) {
    includes = [className]
    description = "Runs the integration tests on class $className."
    group = 'verification'
    testClassesDirs = sourceSets.integrationTest.output.classesDirs
    classpath = sourceSets.integrationTest.runtimeClasspath
    maxHeapSize = '1536m'
    mustRunAfter test
  }

  integrationTest.dependsOn "it${index + 1}"
}

check.dependsOn integrationTest
