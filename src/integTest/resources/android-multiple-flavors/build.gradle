buildscript {
  repositories {
    google()
    mavenCentral()
  }

  // Mapping between Gradle and Android plugin versions:
  // https://developer.android.com/studio/releases/gradle-plugin
  // Each rung is a hard compatibility floor/ceiling, not a preference:
  //  - AGP 7.x calls DependencyHandler.module(Object), which Gradle 9 removed, so Gradle 9 cannot use AGP 7.
  //  - AGP 8.x uses the internal org.gradle.api.problems.internal.InternalProblems, which Gradle 9.6 removed, so
  //    Gradle 9.6+ cannot use AGP 8. See https://docs.gradle.org/current/userguide/upgrading_version_9.html
  //    #agp_8x_incompatible
  //  - AGP 9.x requires Gradle 9.5 or higher, so it cannot serve Gradle 8.x or Gradle 9.0.
  // The DSL below (namespace / compileSdk / minSdk / targetSdk) is the syntax AGP 7.4, 8.x and 9.x all accept,
  // which is why no AGP older than 7.4 can be used here any more.
  def currentGradleVersion = org.gradle.util.GradleVersion.version(gradle.gradleVersion)
  def androidGradlePluginVersion
  if (currentGradleVersion >= org.gradle.util.GradleVersion.version('9.5')) {
    androidGradlePluginVersion = '9.3.2'
  } else if (currentGradleVersion >= org.gradle.util.GradleVersion.version('9.0')) {
    androidGradlePluginVersion = '8.13.2'
  } else {
    androidGradlePluginVersion = '7.4.0'
  }

  dependencies {
    classpath "com.android.tools.build:gradle:$androidGradlePluginVersion"
  }
}

plugins {
  id 'org.sonatype.gradle.plugins.scan'
}

allprojects {
  repositories {
    google()
    mavenCentral()
  }
}

ext {
  compileSdk=28
  minSdk=21
  targetSdk=28
}

nexusIQScan {
  serverUrl = 'http://localhost:8081'
  username = 'admin'
  password = 'admin123'
  applicationId = 'testing-gradle-plugin'
  simulationEnabled = true
}

ossIndexAudit {
  simulationEnabled = true
  outputFormat = 'DEPENDENCY_GRAPH'
  showAll = true
}
