plugins {
  id 'java'
  id 'org.sonatype.gradle.plugins.scan'
}

repositories {
  mavenCentral()
}
dependencies {
  implementation 'org.hamcrest:hamcrest-core:2.2'
}
ossIndexAudit {
  simulationEnabled = true
  colorEnabled = false
  outputFormat = 'DEPENDENCY_GRAPH'
  showAll = true
}
