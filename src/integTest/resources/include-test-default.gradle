plugins {
  id 'java'
  id 'org.sonatype.gradle.plugins.scan'
}

repositories {
  mavenCentral()
}

dependencies {
  testImplementation 'commons-collections:commons-collections:3.1'
}

ossIndexAudit {
  allConfigurations = true
  simulationEnabled = true
  showAll = true
}
