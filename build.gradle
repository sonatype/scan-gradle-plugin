plugins {
  id 'net.researchgate.release' version '3.1.0'
  id 'com.gradle.plugin-publish' version '2.1.1'
  id 'org.jreleaser' version '1.25.0'
  id 'com.gradleup.shadow' version '9.0.0-rc3'
  id 'com.github.hierynomus.license' version '0.16.1'
}

apply from: 'gradle/integration-test.gradle'

// Plugin publishing configuration
def pluginDescription = 'Scan, evaluate and audit Gradle projects using Sonatype platforms'
def pluginUrl = 'https://github.com/sonatype/scan-gradle-plugin'

gradlePlugin {
  plugins {
    scan {
      id = 'org.sonatype.gradle.plugins.scan'
      implementationClass = 'org.sonatype.gradle.plugins.scan.ScanPlugin'
      displayName = project.name
      description = pluginDescription
      website = pluginUrl
      vcsUrl = pluginUrl
      tags.set(['sonatype', 'scan', 'dependencies', 'ossindex', 'iq server', 'lifecycle'])
      System.setProperty('gradle.publish.key', System.getenv('GRADLE_PUBLISH_KEY') ?: '')
      System.setProperty('gradle.publish.secret', System.getenv('GRADLE_PUBLISH_SECRET') ?: '')
    }
  }
}

java {
  sourceCompatibility = JavaVersion.VERSION_17
  targetCompatibility = JavaVersion.VERSION_17
  withJavadocJar()
  withSourcesJar()
}

if (JavaVersion.current() != JavaVersion.VERSION_17) {
  throw new GradleException(
      "The java version used ${JavaVersion.current()} is not the expected version ${JavaVersion.VERSION_17}.")
}

tasks.withType(Javadoc).configureEach {
  options.addStringOption('Xdoclint:all,-missing', '-quiet')
}

jar {
  manifest {
    attributes(
      'Build-Timestamp' : new Date().format("yyyy-MM-dd'T'HH:mm:ss.SSSZ"),
      'Build-Revision'  : project.version,
      'Built-By'        : 'Sonatype',
      'Created-By'      : "Gradle ${gradle.gradleVersion}",
      'Build-Jdk'       : "${System.properties['java.version']} (${System.properties['java.vendor']} ${System.properties['java.vm.version']})",
    )
  }
}

allprojects {
  repositories {
    maven {
      name = 'sonatype.repo.sonatype.app'
      url = 'https://sonatype.repo.sonatype.app/repository/maven-private'
      credentials {
        username = System.getenv("NEXUS_RM_USERNAME")
        password = System.getenv("NEXUS_RM_PASSWORD")
      }
    }
    mavenCentral()
  }
}

ext {
  insightScannerVersion='3.0.58-01'
}

dependencies {
  implementation 'com.sonatype.insight.brain:insight-brain-client:2.1.16-01'
  implementation 'com.sonatype.clm:com.sonatype.clm.dto.model:2.1.37-01'
  implementation "com.sonatype.insight.scan:insight-scanner-archive:$insightScannerVersion"
  implementation "com.sonatype.insight.scan:insight-client-utils:$insightScannerVersion"
  implementation "com.sonatype.insight.scan:insight-scanner-model:$insightScannerVersion"
  implementation "com.sonatype.insight.scan:insight-module-model:$insightScannerVersion"
  implementation 'org.sonatype.ossindex:ossindex-service-client:1.8.2'
  implementation 'ch.qos.logback:logback-classic:1.6.3'
  implementation 'commons-io:commons-io:2.16.1'

  // Transitive dependency pinning
  constraints {
    implementation('com.fasterxml.woodstox:woodstox-core') {
      version {
        strictly('7.2.2')
      }
      because('Pinning version to avoid license selection issues')
    }
    implementation('javax.xml.bind:jaxb-api') {
      version {
        strictly('2.3.0')
      }
      because('Pinning version to avoid license selection issues')
    }
    implementation('org.jsoup:jsoup:1.23.2') {
      because('Pinning version to avoid CVE-2026-75140 and sonatype-2026-005445')
    }
    implementation('org.codehaus.plexus:plexus-utils:3.6.2') {
      because('Pinning version to avoid CVE-2025-67030')
    }
    implementation('org.apache.logging.log4j:log4j-api:2.26.1') {
      because('Temporarily pinning version to avoid sonatype-2026-006746')
    }
  }

  testImplementation gradleTestKit()
  testImplementation 'junit:junit:4.13.2'
  testImplementation 'org.assertj:assertj-core:3.27.7'
  testImplementation 'org.mockito:mockito-core:5.12.0'
}

processResources {
  filesMatching('com/sonatype/insight/client.properties') {
    expand(project.properties)
  }
}

license {
  header = file('header.txt')
  excludes([
      '**/banner.txt'
  ])
  mapping {
    java = 'SLASHSTAR_STYLE'
  }
}

test {
  maxHeapSize = '512m'
}

// Copies the original dependency jars, before shadowJar relocates any of their packages.
tasks.register('copyDependencies', Copy) {
  description = 'Copies the runtime dependency jars into build/dependencies.'
  group = 'build'
  from configurations.runtimeClasspath
  into layout.buildDirectory.dir('dependencies')
}

tasks.shadowJar {
  archiveClassifier = ''
  enableAutoRelocation = false
  relocate('org.objectweb.asm', 'org.sonatype.gradle.plugins.scan.shadow.org.objectweb.asm')
  relocate('org.apache.commons', 'org.sonatype.gradle.plugins.scan.shadow.org.apache.commons')
  exclude 'groovyjarjarasm/**'
  mergeServiceFiles()
}

publishing {
  publications {
    withType(MavenPublication) {
      groupId = 'org.sonatype.gradle.plugins'
      artifactId = project.name
      version = project.version.toString()

      pom {
        name = project.name
        description = pluginDescription
        url = 'https://github.com/sonatype/scan-gradle-plugin'
        organization {
          name = 'Sonatype'
          url = 'https://www.sonatype.com'
        }
        issueManagement {
          system = 'GitHub'
          url = 'https://github.com/sonatype/scan-gradle-plugin/issues'
        }
        licenses {
          license {
            name = 'Sonatype-Integration-Terms-EULA'
            url = 'https://www.sonatype.com/dnt/usage/integration-api-eula'
            distribution = 'repo'
          }
        }
        scm {
          connection = 'scm:git:git://github.com/sonatype/scan-gradle-plugin.git'
          developerConnection = 'scm:git:ssh://git@github.com:sonatype/scan-gradle-plugin.git'
          url = 'https://github.com/sonatype/scan-gradle-plugin'
        }
      }
    }
  }
  repositories {
    maven {
      url = layout.buildDirectory.dir('staging-deploy')
    }
  }
}

jreleaser {
  project {
    name = 'scan-gradle-plugin'
    description = pluginDescription
    website = pluginUrl
  }
  signing {
    active = 'ALWAYS'
    armored = true
    def publicKey = System.getenv('JRELEASER_GPG_PUBLIC_KEY')?.decodeBase64() ?
        new String(System.getenv('JRELEASER_GPG_PUBLIC_KEY').decodeBase64()) : ''
    def secretKey = System.getenv('JRELEASER_GPG_SECRET_KEY')?.decodeBase64() ?
        new String(System.getenv('JRELEASER_GPG_SECRET_KEY').decodeBase64()) : ''

    if (publicKey) {
      System.setProperty('jreleaser.gpg.public.key', publicKey)
    }
    if (secretKey) {
      System.setProperty('jreleaser.gpg.secret.key', secretKey)
    }
  }
  deploy {
    maven {
      mavenCentral {
        sonatype {
          active = 'ALWAYS'
          url = 'https://central.sonatype.com/api/v1/publisher'
          verifyPom = false
          stagingRepository('build/staging-deploy')
        }
      }
    }
  }
}

// Remove unwanted "scan" directory after publishing
tasks.register('cleanupUnwantedArtifacts') {
  doLast {
    def unwantedDir = file("build/staging-deploy/org/sonatype/gradle/plugins/scan")
    if (unwantedDir.exists()) {
      println "Removing unwanted directory: $unwantedDir"
      delete unwantedDir
    }
  }
}

afterReleaseBuild.dependsOn publish
publish.finalizedBy cleanupUnwantedArtifacts
publish.finalizedBy publishPlugins

/*
 * Blocks releases with SNAPSHOT dependencies, if the `isReleaseJob` project property is set (not set by default).
 * User `-PisReleaseJob` to enable it
 */
if (project.hasProperty('isReleaseJob')) {
  project.getConfigurations().configureEach { config ->
    config.incoming.beforeResolve {
      config.dependencies.each { dep ->
        if (dep.hasProperty('version') && dep.version?.contains('SNAPSHOT')) {
          throw new GradleException("SNAPSHOT versions are forbidden in releases.\nculprit: ${dep.group}:${dep.name}:${dep.version}")
        }
      }
    }
  }
}
